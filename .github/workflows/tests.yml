name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The site under test is someone else's. A nightly run catches the day it
    # changes, rather than finding out during an interview.
    - cron: "0 6 * * *"

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run the suite
        env:
          HEADLESS: "1"
        run: pytest -v

      - name: Keep the evidence from any failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: reports/failures/
          retention-days: 14
          if-no-files-found: ignore
